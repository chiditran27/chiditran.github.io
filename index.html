<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Soạn Toán Tự Động - Cấp 2 & 3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Thư viện hiển thị công thức Toán -->
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .latex-box { background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 8px; font-family: monospace; white-space: pre-wrap; margin-top: 10px; font-size: 14px; overflow-x: auto;}
    </style>
</head>
<body class="p-6">
    <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-lg p-8">
        <h1 class="text-3xl font-bold text-blue-600 mb-2 text-center">TỔNG ĐÀI SOẠN TOÁN (LỚP 6 - 12)</h1>
        <p class="text-center text-gray-500 mb-8">Hệ thống tạo Đề thi & Bài giảng tự động xuất chuẩn LaTeX</p>

        <!-- Cấu hình API -->
        <div class="bg-blue-50 p-4 rounded-lg mb-6 border border-blue-200">
            <label class="block text-sm font-semibold text-blue-800 mb-1">BƯỚC 1: Kết nối Bộ não AI (Chỉ nhập 1 lần)</label>
            <input type="password" id="apiKey" placeholder="Dán Gemini API Key của bạn vào đây..." class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-400 outline-none">
            <p class="text-xs text-blue-600 mt-1">Lấy key miễn phí tại: aistudio.google.com</p>
        </div>

        <!-- Khung nhập yêu cầu -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div>
                <label class="block text-sm font-semibold mb-1">Chọn Lớp:</label>
                <select id="lop" class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-400 outline-none">
                    <option value="Lớp 9">Lớp 9</option>
                    <option value="Lớp 10">Lớp 10</option>
                    <option value="Lớp 11">Lớp 11</option>
                    <option value="Lớp 12">Lớp 12</option>
                    <option value="Lớp 6">Lớp 6</option>
                    <option value="Lớp 7">Lớp 7</option>
                    <option value="Lớp 8">Lớp 8</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">Loại tài liệu:</label>
                <select id="loaiTaiLieu" class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-400 outline-none">
                    <option value="Đề kiểm tra 15 phút (Trắc nghiệm + Tự luận)">Đề kiểm tra 15 phút</option>
                    <option value="Đề kiểm tra 45 phút">Đề kiểm tra 45 phút</option>
                    <option value="Bài giảng tóm tắt + Bài tập mẫu">Bài giảng & Bài tập</option>
                    <option value="Phiếu bài tập về nhà">Phiếu bài tập về nhà</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">Mức độ:</label>
                <select id="mucDo" class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-400 outline-none">
                    <option value="Trung bình - Khá (Bám sát SGK)">Trung bình - Khá</option>
                    <option value="Khó - Vận dụng cao">Khó - Vận dụng cao</option>
                    <option value="Cơ bản (Dành cho học sinh mất gốc)">Cơ bản (Cho học sinh yếu)</option>
                </select>
            </div>
        </div>

        <div class="mb-6">
            <label class="block text-sm font-semibold mb-1">Chuyên đề cụ thể & Yêu cầu chi tiết:</label>
            <textarea id="chuDe" rows="3" placeholder="Ví dụ: Hàm số bậc 2, yêu cầu có 1 bài toán thực tế cái cầu parabol..." class="w-full p-3 border rounded focus:ring-2 focus:ring-blue-400 outline-none"></textarea>
        </div>

        <button onclick="taoDe()" id="btnTaoDe" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded transition duration-200">
            🚀 BẮT ĐẦU SOẠN ĐỀ
        </button>

        <!-- Loading -->
        <div id="loading" class="hidden text-center mt-6 text-gray-600 font-semibold animate-pulse">
            AI đang phân tích chương trình học và soạn toán (khoảng 10-20 giây)...
        </div>

        <!-- Kết quả -->
        <div id="result-container" class="hidden mt-8">
            <h2 class="text-xl font-bold border-b pb-2 mb-4 text-green-700">✅ KẾT QUẢ TẠO THÀNH CÔNG</h2>
            
            <div class="mb-4">
                <button onclick="copyLatex()" class="bg-gray-800 hover:bg-black text-white px-4 py-2 rounded text-sm font-semibold shadow">
                    📋 Copy Mã LaTeX (Để dán vào Overleaf tạo PDF)
                </button>
                <span id="copyMsg" class="text-green-600 text-sm ml-2 hidden">Đã copy thành công!</span>
            </div>

            <!-- Nơi chứa nội dung hiển thị cho người xem -->
            <div id="visual-result" class="p-6 bg-white border rounded shadow-inner prose max-w-none"></div>

            <!-- Nơi chứa mã nguồn LaTeX ẩn -->
            <div id="latex-result" class="latex-box hidden"></div>
        </div>
    </div>

    <script>
        // Tự động load API key nếu đã lưu
        if(localStorage.getItem('gemini_api_key')) {
            document.getElementById('apiKey').value = localStorage.getItem('gemini_api_key');
        }

        async function taoDe() {
            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) { alert("Vui lòng nhập Gemini API Key ở Bước 1!"); return; }
            localStorage.setItem('gemini_api_key', apiKey); // Lưu lại cho lần sau

            const lop = document.getElementById('lop').value;
            const loaiTaiLieu = document.getElementById('loaiTaiLieu').value;
            const mucDo = document.getElementById('mucDo').value;
            const chuDe = document.getElementById('chuDe').value.trim();

            if (!chuDe) { alert("Vui lòng nhập chuyên đề bạn muốn soạn!"); return; }

            // Đóng gói lệnh gửi cho AI (Luật Thép)
            const prompt = `Bạn là một Chuyên gia Toán học Việt Nam giàu kinh nghiệm, chuyên ra đề và soạn giáo án cho học sinh THCS và THPT (Lớp 6 đến Lớp 12). Tuyệt đối không đưa kiến thức Đại học vào. Đảm bảo độ chính xác logic tuyệt đối.
            
            NHIỆM VỤ CỦA BẠN: Soạn 1 ${loaiTaiLieu} cho môn Toán ${lop}. 
            Chuyên đề/Nội dung: ${chuDe}. 
            Mức độ: ${mucDo}.
            
            YÊU CẦU TRÌNH BÀY (BẮT BUỘC):
            1. Luôn chia làm 2 phần rõ rệt: 
               - PHẦN 1: ĐỀ BÀI (Dành cho học sinh).
               - PHẦN 2: ĐÁP ÁN & HƯỚNG DẪN GIẢI CHI TIẾT.
            2. Về chuẩn định dạng Toán học: 100% các biểu thức toán, phân số, công thức, số mũ, căn thức... PHẢI được viết dưới dạng mã LaTeX thuần túy, bọc trong dấu đô-la (ví dụ $x^2 + 1 = 0$ hoặc $$\\frac{1}{2}$$). Không dùng kí tự Unicode text thông thường.
            
            Hãy xuất trực tiếp nội dung bài học, không cần giải thích chào hỏi dài dòng.`;

            document.getElementById('btnTaoDe').disabled = true;
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('result-container').classList.add('hidden');

            try {
                // Gọi Google Gemini API
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                
                if(data.error) {
                    throw new Error(data.error.message);
                }

                const responseText = data.candidates[0].content.parts[0].text;

                // Hiển thị giao diện xem trước (dùng Marked js chuyển Markdown)
                document.getElementById('visual-result').innerHTML = marked.parse(responseText);
                // Gọi MathJax để nó biến các mã $...$ thành biểu thức Toán học đẹp mắt
                MathJax.typesetPromise([document.getElementById('visual-result')]);

                // Lưu mã gốc để copy sang Overleaf
                document.getElementById('latex-result').innerText = responseText;
                
                document.getElementById('result-container').classList.remove('hidden');
            } catch (error) {
                alert("Lỗi: " + error.message + "\n(Vui lòng kiểm tra lại API Key xem đã đúng chưa)");
            } finally {
                document.getElementById('btnTaoDe').disabled = false;
                document.getElementById('loading').classList.add('hidden');
            }
        }

        function copyLatex() {
            const latexText = document.getElementById('latex-result').innerText;
            navigator.clipboard.writeText(latexText).then(() => {
                const msg = document.getElementById('copyMsg');
                msg.classList.remove('hidden');
                setTimeout(() => msg.classList.add('hidden'), 3000);
            });
        }
    </script>
</body>
</html>
